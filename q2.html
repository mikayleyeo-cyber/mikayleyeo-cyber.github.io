<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Aiden has sent you a message</title>
        <link href="style.css" rel="stylesheet">

    </head>
    <body>
        <div class="container">
            <img src="q2.jpg">
            <h3>How will you reply?</h3>

            <!-- buttons -->
            <nav>
            <ul>
                <li> <a href="#" onclick="showFeedback('❌ DANGER! Impersonators use AI to edit or deepfake photos instantly. They now own your image forever.', 'red', 'q2n.html')">Give in and send the picture</a> </li>
                <li><a href="#" onclick="showFeedback('⚠️ RISKY! This does not put a stop to the situation and just leaves the conversation open.', 'orange',  'q2n.html')">Don't reply</a></li>
                <li> <a href="#" onclick="showFeedback('✅ SAFE CHOICE! Always verify identity before sharing.', 'green',  'q2y.html')">Tell him you'll talk to him IRL</a> </li>
            </ul>
            </nav>
            <div id="feedback" class="feedback"></div>
        </div>
        
        <script>
        function showFeedback(message, color, nextPage) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = message;
            feedback.className = `feedback ${color}`;
            feedback.style.display = 'block';
            feedback.scrollIntoView({ behavior: 'smooth' });
    // Delay navigation by 2 seconds so they read feedback
    setTimeout(() => {
        if (nextPage) {
            window.location.href = nextPage;
        }
    }, 2000);
    }
    </script>

    </body>
</html>
