<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Unknown has sent you a message</title>
        <link href="style.css" rel="stylesheet">

    </head>
    <body>
        <div class="container">
            <img src="assignment.jpg">
            <h3>How will you reply?</h3>

            <!-- buttons -->
            <nav>
            <ul>
                <li> <a href="#" onclick="showFeedback('❌ DANGER! Impersonators use AI to edit or deepfake photos instantly. They now own your image forever.', 'red', 'q1n.html')">Send the selfie so he trusts you</a> </li>
                <li> <a href="#" onclick="showFeedback('✅ SAFE CHOICE! Always verify identity before sharing.', 'green',  'q1y.html')">Ask to call on a known number</a> </li>
                <li><a href="#" onclick="showFeedback('⚠️ RISKY! The photo they send you may be fake and does not mean he is who he says he is.', 'orange',  'q1n.html')">Tell him to send a picture first</a></li>
            </ul>
            </nav>
            <div id="feedback" class="feedback"></div>
        </div>

        <!-- popup -->
        <div id="popup" class="popup-overlay">
            <div class="popup-content">
                <h3>⚠️ Safety Alert!</h3>
                <p>An unknown number sent you a message.</p>
                <button onclick="closePopup()" class="popup-btn">Got it!</button>
            </div>
        </div>
        
        <script>
        function showFeedback(message, color, nextPage) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = message;
            feedback.className = `feedback ${color}`;
            feedback.style.display = 'block';
            feedback.scrollIntoView({ behavior: 'smooth' });
    // Delay navigation by 2 seconds so they read feedback
    setTimeout(() => {
        if (nextPage) {
            window.location.href = nextPage;
        }
    }, 2000);
    }
    </script>

    </body>
</html>
